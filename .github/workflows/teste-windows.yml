
name: Teste Windows na Nuvem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Verificar o Windows
        shell: pwsh
        run: |
          Write-Host "WINDOWS NA NUVEM INICIADO!"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Sistema: $($os.Caption)"
          Write-Host "Versao: $($os.Version)"
          Write-Host "CPUs: $env:NUMBER_OF_PROCESSORS"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Testar leitura e escrita
        shell: pwsh
        run: |
          $arquivo = Join-Path $env:RUNNER_TEMP "teste.txt"
          "WINDOWS FUNCIONANDO" | Set-Content $arquivo

          $resultado = Get-Content $arquivo

          if ($resultado -ne "WINDOWS FUNCIONANDO") {
            throw "O teste falhou!"
          }

          Write-Host "TESTE APROVADO!"
          Write-Host "A maquina Windows funcionou corretamente."
